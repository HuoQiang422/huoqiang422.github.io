# ============================================================
# NexT Theme Configuration — 寒漓 · 中文阅读优化
# ============================================================

# -----------------------------------------------------------
# Scheme
# Muse:   最简，无侧边栏，纯阅读
# Mist:   Muse + 紧凑头部
# Pisces: 双栏，左侧边栏
# Gemini: 双栏，右侧边栏 + 目录
# -----------------------------------------------------------
scheme: Gemini

# -----------------------------------------------------------
# Dark Mode
# -----------------------------------------------------------
darkmode: true

# -----------------------------------------------------------
# Favicon
# -----------------------------------------------------------
favicon:
  small: /img/favicon.ico
  medium: /img/favicon.ico

# -----------------------------------------------------------
# Menu
# -----------------------------------------------------------
menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive
  categories: /categories/ || fa fa-folder
  tags: /tags/ || fa fa-tags
  about: /about/ || fa fa-user
  characters: /characters/ || fa fa-book

# -----------------------------------------------------------
# Sidebar
# -----------------------------------------------------------
sidebar:
  position: right
  display: post
  offset: 12
  b2t: true          # back-to-top
  scrollpercent: true # reading progress
  toc: true           # table of contents

# -----------------------------------------------------------
# Avatar
# -----------------------------------------------------------
avatar:
  url: /img/avatar.png
  rounded: true
  rotated: false

# -----------------------------------------------------------
# Social Links
# -----------------------------------------------------------
social:
  GitHub: https://github.com/HuoQiang422 || fab fa-github

# -----------------------------------------------------------
# Footer
# -----------------------------------------------------------
footer:
  since: 2025
  powered: false
  theme:
    enable: false

# -----------------------------------------------------------
# Post Settings
# -----------------------------------------------------------
post_meta:
  item_text: true
  created_at: true
  updated_at: false
  categories: true

post_copyright:
  enable: true
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# -----------------------------------------------------------
# Font — 中文字体优化
# 使用系统字体栈，不加载外部字体，渲染最快
# -----------------------------------------------------------
font:
  enable: true
  # 全局字体
  global:
    external: false
    family: '-apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Hiragino Sans GB", "WenQuanYi Micro Hei", sans-serif'
    size: 16px
  # 标题字体
  headings:
    external: false
    family: '-apple-system, "PingFang SC", "Noto Serif CJK SC", "Microsoft YaHei", sans-serif'
  # 正文字体
  posts:
    external: false
    family: '-apple-system, "PingFang SC", "Noto Serif CJK SC", "Microsoft YaHei", sans-serif'
  # 代码字体
  codes:
    external: false
    family: '"JetBrains Mono", "Fira Code", Consolas, monospace'
    size: 14px

# -----------------------------------------------------------
# Custom Styles — 中文排版微调
# -----------------------------------------------------------
custom_file_path:
  style: source/_data/styles.styl

# -----------------------------------------------------------
# Code Highlight
# -----------------------------------------------------------
codeblock:
  copy_button:
    enable: false
    show_result: false

# -----------------------------------------------------------
# Reading Progress
# -----------------------------------------------------------
reading_progress:
  enable: true
  start_at: left
  color: "#3b82f6"
  height: 3px

# -----------------------------------------------------------
# Bookmark (save reading position)
# -----------------------------------------------------------
bookmark:
  enable: true
  color: "#3b82f6"
  save: auto

# -----------------------------------------------------------
# Back to Top
# -----------------------------------------------------------
back2top:
  enable: true
  sidebar: true
  scrollpercent: true

# -----------------------------------------------------------
# TOC (Table of Contents)
# -----------------------------------------------------------
toc:
  enable: true
  number: false
  wrap: true
  expand_all: false
  max_depth: 3

# -----------------------------------------------------------
# Word Count & Reading Time
# -----------------------------------------------------------
symbols_count_time:
  enable: true
  separated_meta: true
  item_text_total: true
  item_text_post: true
  awl: 4    # 中文每分钟阅读字数
  wpm: 200  # 英文每分钟阅读字数

# -----------------------------------------------------------
# SEO
# -----------------------------------------------------------
seo: true

# -----------------------------------------------------------
# Creative Commons
# -----------------------------------------------------------
creative_commons:
  license: by-nc-sa
  sidebar: false
  post: true
  language: deed.zh

# -----------------------------------------------------------
# GitHub Banner
# -----------------------------------------------------------
github_banner:
  enable: false

# -----------------------------------------------------------
# Canvas Ribbon (关闭 — 分散阅读)
# -----------------------------------------------------------
canvas_ribbon:
  enable: false

# -----------------------------------------------------------
# Local Search
# -----------------------------------------------------------
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 1
  unescape: true
  preload: false
