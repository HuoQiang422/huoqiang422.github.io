# Butterfly Theme Configuration

# Navigation menu
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-heart

# Favicon
favicon: /img/favicon.ico

# Avatar
avatar:
  img: /img/avatar.png
  effect: true

# Social links
social:
  github: https://github.com/HuoQiang422

# Post settings
post_meta:
  page:
    date_type: created
    categories: true
    tags: true
    label: true
  post:
    date_type: both
    categories: true
    tags: true
    label: true

# Code blocks
highlight_theme: light

# Copyright
post_copyright:
  enable: true
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Footer
footer:
  owner:
    enable: true
    since: 2025
  custom_text:
  copyright: true
